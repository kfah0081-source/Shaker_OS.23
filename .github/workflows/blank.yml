name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip project
        run: unzip -o shaker_os_flutter.zip

      - name: Test and build
        working-directory: shaker_os
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter test
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: shaker-os-apk
          path: shaker_os/build/app/outputs/flutter-apk/app-release.apk
